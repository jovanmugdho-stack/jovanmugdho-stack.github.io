<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D3;
    --paper-line:#d9cfae;
    --ink:#2A2620;
    --ink-light:#7a7161;
    --margin-red:#a13b3b;
    --stamp-teal:#2f6f62;
    --gold:#b08d3d;
    --cancel:#8d8477;
    --paper-shadow: rgba(42,38,32,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(
        var(--paper),
        var(--paper) 31px,
        var(--paper-line) 32px
      ),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .sheet{
    max-width:880px;
    margin:0 auto;
    padding:36px 28px 40px 76px;
    position:relative;
  }
  .margin-rule{
    position:absolute;
    left:52px;
    top:0;
    bottom:0;
    width:2px;
    background:var(--margin-red);
    opacity:0.55;
  }
  .margin-rule::before,.margin-rule::after{
    content:'';
    position:absolute;
    left:-4px;
    width:10px;height:10px;
    border-radius:50%;
    background:var(--paper);
    box-shadow: inset 0 0 0 1.5px var(--ink-light);
  }
  .margin-rule::before{top:120px;}
  .margin-rule::after{top:340px;}

  header{margin-bottom:22px;}
  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:2.3rem;
    margin:0 0 4px 0;
    letter-spacing:0.2px;
  }
  .tagline{
    color:var(--ink-light);
    font-size:0.78rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
  }
  .save-status{
    color:var(--stamp-teal);
    font-size:0.72rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    height:16px;
    margin-top:6px;
    opacity:0;
    transition:opacity 0.25s ease;
  }
  .save-status.show{opacity:1;}
  .save-status.err{color:var(--margin-red);}

  .tabs{
    display:flex;
    gap:6px;
    margin-top:26px;
  }
  .tab-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:var(--paper-line);
    color:var(--ink-light);
    border:1px solid var(--ink-light);
    border-bottom:none;
    padding:9px 18px 8px 18px;
    border-radius:6px 6px 0 0;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  .tab-btn.active{
    background:var(--paper);
    color:var(--ink);
    font-weight:600;
    border-color:var(--ink);
  }
  .panel{
    background:var(--paper);
    border:1px solid var(--ink);
    border-radius:0 6px 6px 6px;
    padding:26px;
    min-height:280px;
  }
  .hidden{display:none !important;}

  /* Today tab */
  .date-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
    padding-bottom:16px;
    border-bottom:1px dashed var(--ink-light);
  }
  .date-row label{font-size:0.8rem; color:var(--ink-light); text-transform:uppercase; letter-spacing:0.06em;}
  input[type="date"], input[type="text"], input[type="number"]{
    font-family:'IBM Plex Mono', monospace;
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--ink);
    color:var(--ink);
    font-size:0.95rem;
    padding:4px 2px;
    outline:none;
  }
  .day-label{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    color:var(--stamp-teal);
  }

  .period-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--paper-line);
  }
  .period-row:last-child{border-bottom:none;}
  .period-time{
    width:80px;
    color:var(--ink-light);
    font-size:0.82rem;
    flex-shrink:0;
  }
  .period-subject{
    flex:1;
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.05rem;
  }
  .type-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.62rem;
    font-weight:600;
    letter-spacing:0.05em;
    border:1px solid currentColor;
    border-radius:3px;
    padding:1px 5px;
    vertical-align:middle;
    margin-left:6px;
  }
  .type-badge.class{color:var(--ink-light);}
  .type-badge.lab{color:var(--gold); border-color:var(--gold);}
  .stamp-group{display:flex; gap:8px; flex-shrink:0;}
  .stamp-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.05em;
    font-weight:600;
    padding:6px 10px;
    border-radius:4px;
    border:2px solid;
    background:transparent;
    cursor:pointer;
    transform:rotate(0deg);
    transition:transform 0.08s ease;
  }
  .stamp-btn:hover{transform:rotate(-3deg);}
  .stamp-btn.present{color:var(--stamp-teal); border-color:var(--stamp-teal);}
  .stamp-btn.absent{color:var(--margin-red); border-color:var(--margin-red);}
  .stamp-btn.cancelled{color:var(--cancel); border-color:var(--cancel);}
  .stamp-btn.present.selected{background:var(--stamp-teal); color:var(--paper);}
  .stamp-btn.absent.selected{background:var(--margin-red); color:var(--paper);}
  .stamp-btn.cancelled.selected{background:var(--cancel); color:var(--paper);}
  .stamp-pop{
    display:inline-block;
    animation: stampdown 0.28s ease;
  }
  @keyframes stampdown{
    0%{transform:scale(1.6) rotate(-10deg); opacity:0;}
    60%{transform:scale(0.95) rotate(-3deg); opacity:1;}
    100%{transform:scale(1) rotate(-3deg); opacity:1;}
  }

  .empty-note{
    color:var(--ink-light);
    font-style:italic;
    font-family:'Fraunces', serif;
    padding:24px 0;
  }

  /* Routine tab */
  .day-block{margin-bottom:26px;}
  .day-block h3{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.15rem;
    margin:0 0 10px 0;
    color:var(--ink);
    border-bottom:1px solid var(--ink);
    padding-bottom:4px;
  }
  .routine-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:6px 0;
  }
  .routine-row .period-time{width:110px;}
  .routine-row .period-subject{font-family:'Fraunces', serif; font-weight:500;}
  .del-btn{
    background:none; border:none; cursor:pointer;
    color:var(--margin-red); font-size:1rem; font-weight:700;
    font-family:'IBM Plex Mono', monospace;
  }
  .add-row{
    display:flex; gap:10px; align-items:center; margin-top:8px;
  }
  .add-row input[type="text"]{flex:0 0 110px;}
  .add-row input[type="text"].subj{flex:1;}
  .add-row select{
    font-family:'IBM Plex Mono', monospace;
    background:transparent;
    border:none;
    border-bottom:1.5px solid var(--ink);
    color:var(--ink);
    font-size:0.85rem;
    padding:4px 2px;
  }
  .add-btn{
    font-family:'IBM Plex Mono', monospace;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:6px 14px;
    border-radius:4px;
    cursor:pointer;
    font-size:0.8rem;
  }

  /* Report tab */
  .target-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom:22px;
    padding-bottom:16px;
    border-bottom:1px dashed var(--ink-light);
  }
  .target-row input[type="number"]{width:50px;}
  .month-row{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    margin-bottom:16px;
  }
  .month-row input[type="month"]{font-size:0.9rem;}
  .scope-btns{display:flex; gap:6px;}
  .scope-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    background:transparent;
    border:1.5px solid var(--ink-light);
    color:var(--ink-light);
    padding:5px 11px;
    border-radius:4px;
    cursor:pointer;
  }
  .scope-btn.active{
    border-color:var(--ink);
    color:var(--ink);
    font-weight:600;
    background:var(--paper-line);
  }
  .month-banner{
    background:var(--gold);
    color:var(--paper);
    font-size:0.78rem;
    font-weight:600;
    padding:9px 14px;
    border-radius:4px;
    margin-bottom:18px;
    letter-spacing:0.02em;
  }
  .caption{
    color:var(--ink-light);
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:14px;
  }
  .report-row{
    display:grid;
    grid-template-columns: 1fr auto auto;
    gap:6px 18px;
    align-items:center;
    padding:14px 0;
    border-bottom:1px solid var(--paper-line);
  }
  .report-row:last-child{border-bottom:none;}
  .report-subject{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.1rem;
  }
  .report-pct{
    font-size:1.6rem;
    font-weight:600;
    text-align:right;
    min-width:80px;
  }
  .report-advice{
    grid-column:1 / -1;
    font-size:0.82rem;
    color:var(--ink-light);
  }
  .tally-line{grid-column:1/-1; display:flex; flex-wrap:wrap; gap:2px 0; align-items:center; margin-top:2px;}
  .tally-group{position:relative; display:inline-flex; margin-right:9px; height:18px; align-items:flex-end;}
  .stroke{width:3px; height:16px; display:inline-block; margin-right:3px; border-radius:1px;}
  .diagonal{position:absolute; width:24px; height:3px; top:6px; left:-3px; transform:rotate(-38deg); border-radius:1px;}
  .tally-plus{color:var(--ink-light); font-size:0.75rem; margin-left:4px;}

  .overall-box{
    background:var(--paper-line);
    border:1px solid var(--ink);
    border-radius:6px;
    padding:20px 22px;
    margin-bottom:26px;
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:10px;
  }
  .overall-box .report-subject{font-size:1.25rem;}
  .overall-box .report-pct{font-size:2.1rem;}

  footer.note{
    max-width:880px;
    margin:18px auto 0 auto;
    padding:0 28px 0 76px;
    color:var(--ink-light);
    font-size:0.72rem;
  }

  @media (max-width:560px){
    .sheet{padding:28px 16px 40px 52px;}
    .margin-rule{left:32px;}
    h1{font-size:1.7rem;}
    .stamp-btn{padding:5px 7px; font-size:0.62rem;}
    .report-pct{font-size:1.25rem;}
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="margin-rule"></div>
  <header>
    <h1>Attendance Register</h1>
    <div class="tagline">mind your percentage, keep your seat</div>
    <div class="save-status" id="save-status"></div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="routine">Routine</button>
    <button class="tab-btn" data-tab="report">Report</button>
  </div>

  <div class="panel" id="panel-today">
    <div class="date-row">
      <label for="date-pick">Date</label>
      <input type="date" id="date-pick">
      <span class="day-label" id="day-label"></span>
    </div>
    <div id="today-list"></div>
  </div>

  <div class="panel hidden" id="panel-routine">
    <div id="routine-list"></div>
  </div>

  <div class="panel hidden" id="panel-report">
    <div class="target-row">
      <label for="target-input">Target attendance</label>
      <input type="number" id="target-input" min="1" max="100" value="75">
      <span>%</span>
    </div>
    <div class="month-row">
      <input type="month" id="month-pick">
      <div class="scope-btns">
        <button class="scope-btn active" data-scope="month">This month</button>
        <button class="scope-btn" data-scope="all">All time</button>
      </div>
    </div>
    <div id="month-banner-slot"></div>
    <div id="overall-slot"></div>
    <div class="caption">By subject — lowest attendance first</div>
    <div id="report-list"></div>
  </div>

  <footer class="note">Saved automatically on this device. Add your weekly classes in Routine, then stamp attendance each day in Today.</footer>
</div>

<script>
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_FULL = {Sun:'Sunday',Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday'};
const WEIGHT = {class:2, lab:3};
function periodWeight(p){ return WEIGHT[p && p.type] || WEIGHT.class; }

let routine = {Mon:[],Tue:[],Wed:[],Thu:[],Fri:[],Sat:[],Sun:[]};
let attendance = {}; // key: `${date}#${idx}` -> 'present'|'absent'|'cancelled'
let settings = {target:75};

async function storageGet(key){
  if(window.storage && typeof window.storage.get === 'function'){
    try{ return await window.storage.get(key); }
    catch(e){ /* key not found in artifact storage */ }
  }
  try{
    const raw = localStorage.getItem('attreg_'+key);
    return raw ? {value: raw} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  let savedRemotely = false;
  let savedLocally = false;
  if(window.storage && typeof window.storage.set === 'function'){
    try{ await window.storage.set(key, value); savedRemotely = true; }
    catch(e){ console.error('artifact storage set failed', e); }
  }
  try{ localStorage.setItem('attreg_'+key, value); savedLocally = true; }
  catch(e){ console.error('localStorage save failed', e); }
  flashSaveStatus(savedRemotely || savedLocally);
}

let saveStatusTimer = null;
function flashSaveStatus(ok){
  const el = document.getElementById('save-status');
  if(!el) return;
  el.textContent = ok ? 'Saved' : 'Could not save — storage unavailable';
  el.classList.toggle('err', !ok);
  el.classList.add('show');
  clearTimeout(saveStatusTimer);
  saveStatusTimer = setTimeout(()=>el.classList.remove('show'), 1400);
}

async function loadState(){
  try{
    const r = await storageGet('routine');
    if(r && r.value) routine = Object.assign(routine, JSON.parse(r.value));
  }catch(e){ /* not found, keep default */ }
  try{
    const a = await storageGet('attendance');
    if(a && a.value) attendance = JSON.parse(a.value);
  }catch(e){}
  try{
    const s = await storageGet('settings');
    if(s && s.value) settings = Object.assign(settings, JSON.parse(s.value));
  }catch(e){}
}

async function saveRoutine(){
  await storageSet('routine', JSON.stringify(routine));
}
async function saveAttendance(){
  await storageSet('attendance', JSON.stringify(attendance));
}
async function saveSettings(){
  await storageSet('settings', JSON.stringify(settings));
}

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}

function dayOfWeek(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return DAYS[d.getDay()];
}

function isSecondSaturday(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(d.getDay()!==6) return false;
  const date = d.getDate();
  return date>=8 && date<=14;
}
function isHoliday(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(d.getDay()===0) return true;
  return isSecondSaturday(dateStr);
}
function holidayLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(d.getDay()===0) return 'Sunday — weekly holiday.';
  return 'Second Saturday — university holiday.';
}

/* ---------- TABS ---------- */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.add('hidden'));
    document.getElementById('panel-'+btn.dataset.tab).classList.remove('hidden');
    if(btn.dataset.tab==='report') renderReport();
    if(btn.dataset.tab==='routine') renderRoutine();
    if(btn.dataset.tab==='today') renderToday();
  });
});

/* ---------- TODAY ---------- */
const datePick = document.getElementById('date-pick');
datePick.value = todayStr();
datePick.addEventListener('change', renderToday);

function renderToday(){
  const date = datePick.value || todayStr();
  const day = dayOfWeek(date);
  document.getElementById('day-label').textContent = DAY_FULL[day];
  const list = document.getElementById('today-list');
  list.innerHTML = '';
  if(isHoliday(date)){
    list.innerHTML = '<div class="empty-note">'+holidayLabel(date)+' No classes to mark.</div>';
    return;
  }
  const periods = routine[day] || [];
  if(periods.length===0){
    list.innerHTML = '<div class="empty-note">No classes scheduled for '+DAY_FULL[day]+'. Add some in the Routine tab.</div>';
    return;
  }
  periods.forEach((p, idx)=>{
    const key = date+'#'+idx;
    const current = attendance[key];
    const row = document.createElement('div');
    row.className = 'period-row';
    row.innerHTML = `
      <div class="period-time">${escapeHtml(p.time||'')}</div>
      <div class="period-subject">${escapeHtml(p.subject)} <span class="type-badge ${p.type==='lab'?'lab':'class'}">${p.type==='lab'?'LAB · 3':'CLASS · 2'}</span></div>
      <div class="stamp-group">
        <button class="stamp-btn present ${current==='present'?'selected':''}" data-status="present">PRESENT</button>
        <button class="stamp-btn absent ${current==='absent'?'selected':''}" data-status="absent">ABSENT</button>
        <button class="stamp-btn cancelled ${current==='cancelled'?'selected':''}" data-status="cancelled">CANCELLED</button>
      </div>
    `;
    row.querySelectorAll('.stamp-btn').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const status = b.dataset.status;
        if(attendance[key]===status){
          delete attendance[key]; // toggle off
        } else {
          attendance[key] = status;
        }
        await saveAttendance();
        renderToday();
        // small stamp animation replay
        const sel = row.querySelector('.stamp-btn.selected');
        if(sel){ sel.classList.remove('stamp-pop'); void sel.offsetWidth; sel.classList.add('stamp-pop'); }
      });
    });
    list.appendChild(row);
  });
}

/* ---------- ROUTINE ---------- */
function renderRoutine(){
  const wrap = document.getElementById('routine-list');
  wrap.innerHTML = '<div class="empty-note" style="padding:0 0 18px 0; font-size:0.85rem;">Sundays are always off, and the second Saturday of each month is a university holiday — both are skipped automatically.</div>';
  const order = ['Mon','Tue','Wed','Thu','Fri','Sat'];
  order.forEach(day=>{
    const block = document.createElement('div');
    block.className = 'day-block';
    const periods = routine[day] || [];
    let rowsHtml = periods.map((p,idx)=>`
      <div class="routine-row">
        <div class="period-time">${escapeHtml(p.time||'')}</div>
        <div class="period-subject">${escapeHtml(p.subject)} <span class="type-badge ${p.type==='lab'?'lab':'class'}">${p.type==='lab'?'LAB · 3':'CLASS · 2'}</span></div>
        <button class="del-btn" data-day="${day}" data-idx="${idx}" title="Remove">✕</button>
      </div>
    `).join('');
    if(!rowsHtml) rowsHtml = '<div class="empty-note" style="padding:6px 0;">No classes added.</div>';
    block.innerHTML = `
      <h3>${DAY_FULL[day]}</h3>
      ${rowsHtml}
      <div class="add-row">
        <input type="text" placeholder="time e.g. 9:00" class="new-time">
        <input type="text" placeholder="subject name" class="new-subj subj">
        <select class="new-type">
          <option value="class">Class · 2</option>
          <option value="lab">Lab · 3</option>
        </select>
        <button class="add-btn" data-day="${day}">Add class</button>
      </div>
    `;
    wrap.appendChild(block);
  });

  wrap.querySelectorAll('.del-btn').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const day = b.dataset.day, idx = parseInt(b.dataset.idx,10);
      routine[day].splice(idx,1);
      await saveRoutine();
      renderRoutine();
    });
  });
  wrap.querySelectorAll('.add-btn').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const day = b.dataset.day;
      const block = b.closest('.day-block');
      const timeVal = block.querySelector('.new-time').value.trim();
      const subjVal = block.querySelector('.new-subj').value.trim();
      const typeVal = block.querySelector('.new-type').value;
      if(!subjVal) return;
      routine[day] = routine[day] || [];
      routine[day].push({time:timeVal, subject:subjVal, type:typeVal});
      await saveRoutine();
      renderRoutine();
    });
  });
}

/* ---------- REPORT ---------- */
const targetInput = document.getElementById('target-input');
targetInput.addEventListener('change', async ()=>{
  let v = parseInt(targetInput.value,10);
  if(isNaN(v)) v = 75;
  v = Math.max(1, Math.min(100, v));
  settings.target = v;
  targetInput.value = v;
  await saveSettings();
  renderReport();
});

const monthPick = document.getElementById('month-pick');
monthPick.value = todayStr().slice(0,7);
monthPick.addEventListener('change', renderReport);

let reportScope = 'month';
document.querySelectorAll('.scope-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.scope-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    reportScope = b.dataset.scope;
    monthPick.disabled = (reportScope==='all');
    renderReport();
  });
});

function isLastDayOfMonth(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const next = new Date(d);
  next.setDate(d.getDate()+1);
  return next.getMonth() !== d.getMonth();
}

function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  return d.toLocaleString('en-US', {month:'long', year:'numeric'});
}

function tallyHtml(count, colorVar){
  const cap = 25;
  const shown = Math.min(count, cap);
  let html = '<div class="tally-line">';
  let remaining = shown;
  while(remaining > 0){
    const inGroup = Math.min(5, remaining);
    html += '<span class="tally-group">';
    for(let i=0;i<Math.min(inGroup,4);i++){
      html += `<span class="stroke" style="background:${colorVar}"></span>`;
    }
    if(inGroup===5){
      html += `<span class="diagonal" style="background:${colorVar}"></span>`;
    }
    html += '</span>';
    remaining -= inGroup;
  }
  if(count > cap){
    html += `<span class="tally-plus">+${count-cap} more</span>`;
  }
  html += '</div>';
  return html;
}

function calcAdvice(present, total, targetPct){
  if(total===0) return null;
  const frac = targetPct/100;
  const pct = present/total;
  if(pct >= frac){
    if(frac<=0) return {type:'safe', n:'∞'};
    const maxA = Math.floor(present/frac - total);
    return {type:'safe', n: Math.max(0,maxA)};
  } else {
    if(frac>=1) return {type:'need', n:'∞'};
    const n = Math.ceil((frac*total - present)/(1-frac));
    return {type:'need', n};
  }
}

function renderReport(){
  targetInput.value = settings.target;
  const selectedMonth = monthPick.value || todayStr().slice(0,7);
  const bannerSlot = document.getElementById('month-banner-slot');

  // aggregate by subject
  const bySubject = {}; // subject -> {present, absent}
  Object.keys(attendance).forEach(key=>{
    const status = attendance[key];
    if(status==='cancelled') return;
    const [date, idxStr] = key.split('#');
    if(isHoliday(date)) return;
    if(reportScope==='month' && date.slice(0,7)!==selectedMonth) return;
    const idx = parseInt(idxStr,10);
    const day = dayOfWeek(date);
    const periods = routine[day] || [];
    const p = periods[idx];
    const subject = p ? p.subject : '(removed class)';
    const w = periodWeight(p);
    if(!bySubject[subject]) bySubject[subject] = {present:0, absent:0};
    if(status==='present') bySubject[subject].present += w;
    else if(status==='absent') bySubject[subject].absent += w;
  });

  const subjects = Object.keys(bySubject);
  const overallSlot = document.getElementById('overall-slot');
  const list = document.getElementById('report-list');

  // end-of-month banner
  if(reportScope==='month'){
    const today = todayStr();
    const currentMonth = today.slice(0,7);
    if(selectedMonth < currentMonth){
      bannerSlot.innerHTML = `<div class="month-banner">Final report — ${monthLabel(selectedMonth)} is complete.</div>`;
    } else if(selectedMonth === currentMonth && isLastDayOfMonth(today)){
      bannerSlot.innerHTML = `<div class="month-banner">Today is the last day of ${monthLabel(selectedMonth)} — here's your report for the month.</div>`;
    } else {
      bannerSlot.innerHTML = '';
    }
  } else {
    bannerSlot.innerHTML = '';
  }

  if(subjects.length===0){
    overallSlot.innerHTML = '';
    const scopeMsg = reportScope==='month' ? `No classes marked yet for ${monthLabel(selectedMonth)}.` : 'No classes marked yet — mark attendance in the Today tab first.';
    list.innerHTML = `<div class="empty-note">${scopeMsg}</div>`;
    return;
  }

  let totalP=0, totalT=0;
  subjects.forEach(s=>{ totalP+=bySubject[s].present; totalT+=bySubject[s].present+bySubject[s].absent; });
  const overallPct = totalT? Math.round((totalP/totalT)*1000)/10 : 0;
  const overallAdvice = calcAdvice(totalP, totalT, settings.target);
  const overallColor = overallPct >= settings.target ? 'var(--stamp-teal)' : 'var(--margin-red)';

  overallSlot.innerHTML = `
    <div class="overall-box">
      <div>
        <div class="report-subject">Overall</div>
        ${tallyHtml(totalP,'var(--stamp-teal)')}
        ${tallyHtml(totalT-totalP,'var(--margin-red)')}
        <div class="report-advice">${adviceText(overallAdvice)}</div>
      </div>
      <div class="report-pct" style="color:${overallColor}">${overallPct}%</div>
    </div>
  `;

  const rows = subjects.map(s=>{
    const {present, absent} = bySubject[s];
    const total = present+absent;
    const pct = total? Math.round((present/total)*1000)/10 : 0;
    return {subject:s, present, absent, total, pct};
  }).sort((a,b)=>a.pct-b.pct);

  list.innerHTML = rows.map(r=>{
    const advice = calcAdvice(r.present, r.total, settings.target);
    const color = r.pct >= settings.target ? 'var(--stamp-teal)' : 'var(--margin-red)';
    return `
      <div class="report-row">
        <div class="report-subject">${escapeHtml(r.subject)}</div>
        <div></div>
        <div class="report-pct" style="color:${color}">${r.pct}%</div>
        ${tallyHtml(r.present,'var(--stamp-teal)')}
        ${tallyHtml(r.absent,'var(--margin-red)')}
        <div class="report-advice">${adviceText(advice)} &middot; ${r.present} / ${r.total} attendance units (class=2, lab=3)</div>
      </div>
    `;
  }).join('');
}

function adviceText(advice){
  if(!advice) return '';
  if(advice.type==='safe'){
    if(advice.n===0) return 'At the line — one more miss will drop you below target.';
    return `You can miss <strong>${advice.n}</strong> more class${advice.n===1?'':'es'} and stay at target.`;
  }
  return advice.n==='∞' ? 'Target is 100% — you cannot miss any class.' : `Attend the next <strong>${advice.n}</strong> class${advice.n===1?'':'es'} in a row to reach target.`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

(async function init(){
  await loadState();
  renderToday();
})();
</script>
